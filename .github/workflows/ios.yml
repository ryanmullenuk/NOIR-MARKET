name: iOS simulator checks

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/**'
      - '*.js'
      - '*.html'
      - '*.css'
      - 'package*.json'
      - '.github/workflows/ios.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project generator
        run: brew install xcodegen
      - name: Prepare and check project
        run: npm run ios:setup
      - name: Package ready-to-open Xcode sources
        run: ditto -c -k --keepParent ios ios-xcode-project.zip
      - uses: actions/upload-artifact@v4
        with:
          name: NoirMarket-Xcode-project
          path: ios-xcode-project.zip
          retention-days: 14
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - "$RUNNER_TEMP/simulators.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))['devices']
          for runtime, entries in sorted(devices.items(), reverse=True):
              if '.iOS-26-' not in runtime:
                  continue
              for device in entries:
                  if device['isAvailable'] and device['name'].startswith('iPhone'):
                      print('udid=' + device['udid'])
                      sys.exit(0)
          sys.exit('No available iOS 26 iPhone simulator was found on this runner.')
          PY
      - name: Build and test native startup and free play
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/NoirMarket.xcodeproj \
            -scheme NoirMarket \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -parallel-testing-enabled NO \
            -derivedDataPath ios/build/DerivedData \
            -resultBundlePath ios/build/SimulatorTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            ASSETCATALOG_COMPILER_APPICON_NAME= \
            | tee ios-simulator-build.log
      - name: Save test results and compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NoirMarket-simulator-results
          path: |
            ios/build/SimulatorTests.xcresult
            ios-simulator-build.log
          if-no-files-found: ignore
          retention-days: 14
