name: NoirMarket
options:
  bundleIdPrefix: games.redhead
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  NoirMarket:
    type: application
    platform: iOS
    sources:
      - path: NoirMarket
      - path: Generated/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: games.redhead.noirmarket
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - NoirMarketUITests
  NoirMarketUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: NoirMarketUITests
    dependencies:
      - target: NoirMarket
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: games.redhead.noirmarket.uitests
        TARGETED_DEVICE_FAMILY: '1'
